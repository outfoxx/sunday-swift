name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]

env:
  SUNDAY_OAUTH_TEST_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'live' || 'replay' }}

jobs:

  check-build-test:
    runs-on: macos-26

    steps:

    - name: Install Tools
      run: |
        brew install swiftlint sonar-scanner
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: 1

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/cache@v4
      with:
        path: .build
        key: ${{ runner.os }}-${{ env.MD_APPLE_SDK_ROOT }}-spm-${{ hashFiles('./Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.MD_APPLE_SDK_ROOT }}-spm-

    - name: Test CI helpers
      run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

    - name: SwiftLint
      run: |
        mkdir -p .build
        swiftlint lint --reporter json > .build/swiftlint.json

    - name: Build/Test
      run: set -o pipefail && swift test --enable-code-coverage --sanitize undefined | xcbeautify

    - name: Convert Coverage
      run: xcrun llvm-cov show -instr-profile=.build/debug/codecov/default.profdata .build/debug/SundayPackageTests.xctest/Contents/MacOS/SundayPackageTests > .build/coverage.report

    - name: SonarCloud Scan
      run: sonar-scanner
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  build-test:
  
    runs-on: macos-26

    needs: [check-build-test]

    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios, tvos, watchos]

    steps:

    - name: Install Tools
      run: |
        brew install xcbeautify
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - uses: actions/checkout@v4

    - name: Prepare simulator
      id: simulator
      if: matrix.platform != 'macos'
      timeout-minutes: 8
      run: |
        sudo xcodebuild -runFirstLaunch
        xcodebuild -version
        python3 tools/ci/prepare_simulator.py "${{ matrix.platform }}" --github-output "$GITHUB_OUTPUT"

    - name: Build/Test
      env:
        SUNDAY_TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
      run: make build-test-${{ matrix.platform }}

    - name: Check Test Results
      id: test-results
      if: always()
      run: |
        if [ -d "./TestResults/${{ matrix.platform }}.xcresult" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Report Test Results
      uses: slidoapp/xcresulttool@main
      if: always() && steps.test-results.outputs.exists == 'true'
      with:
          title: Test Results ${{ matrix.platform }}
          path: ./TestResults/${{ matrix.platform }}.xcresult
